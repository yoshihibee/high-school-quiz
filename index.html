<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>高校全15科目 学習・演習総合ポータル（完全版）</title>
  <!-- Excel読み込み用のライブラリ (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --accent: #3b82f6; }
    body { font-family: sans-serif; max-width: 950px; margin: 0 auto; padding: 20px; line-height: 1.6; background: var(--bg); color: var(--text); }
    header { text-align: center; margin-bottom: 20px; }
    header p { color: var(--muted); }
    .tab-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: #334155; color: var(--muted); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .card { border: 1px solid var(--border); padding: 20px; border-radius: 8px; background: var(--card); margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
    .scard { border: 1px solid var(--border); padding: 15px; border-radius: 6px; background: #111827; position: relative; overflow: hidden; cursor: pointer; transition: 0.2s; }
    .scard:hover { border-color: var(--c); transform: translateY(-2px); }
    .scard::before { content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--c); }
    .scard h4 { margin: 0 0 10px 0; }
    
    .roadmap-card { border: 1px solid var(--border); border-radius: 6px; background: #111827; margin-bottom: 12px; overflow: hidden; }
    .roadmap-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .roadmap-header:hover { background: rgba(255,255,255,0.02); }
    .roadmap-body { display: none; padding: 15px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); max-height: 400px; overflow-y: auto; }
    .roadmap-body ol { margin: 0; padding-left: 20px; }
    .roadmap-body li { margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }

    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; }
    .btn:hover { opacity: 0.9; }
    select, input { padding: 10px; width: 100%; margin-bottom: 10px; background: var(--bg); color: #fff; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 3px; }
    
    .upload-box { background: #0b0f19; border: 2px dashed var(--border); padding: 15px; border-radius: 6px; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>高校全15科目 学習・演習総合ポータル</h1>
    <p>Excel「ターゲット・番号・単語・意味」完全対応 ｜ 成績管理・科目別ロードマップ搭載</p>
  </header>

  <div class="tab-menu">
    <button class="tab-btn active" onclick="switchTab('quiz')">🎯 クイズ</button>
    <button class="tab-btn" onclick="switchTab('vocab')">📝 単語記述トレーニング</button>
    <button class="tab-btn" onclick="switchTab('dict')">📚 単語一覧・Excel読込</button>
    <button class="tab-btn" onclick="switchTab('roadmap')">📖 科目別ロードマップ</button>
    <button class="tab-btn" onclick="switchTab('history')">📊 成績・学習状況</button>
  </div>

  <!-- ① クイズ画面 -->
  <div id="view-quiz" class="view-section active">
    <div class="card" id="quiz-select-card">
      <h3>🎯 科目・難易度を選択してクイズ挑戦</h3>
      <div class="grid" id="quiz-subject-list"></div>
    </div>
  </div>

  <!-- ④ ロードマップ画面 -->
  <div id="view-roadmap" class="view-section">
    <div class="card">
      <h3>📖 高校全15科目 50段階学習ステップロードマップ</h3>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:15px;">科目ごとのアコーディオンを開くと、基礎から発展までの具体的な50段階テーマを確認できます。</p>
      <div id="roadmap-container"></div>
    </div>
  </div>

  <script>
    // タブ切り替え関数
    function switchTab(tabId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    const subjects = [
      { 
        code: "eng_read", name: "英語リーディング", color: "#3b82f6",
        steps: [
          "01. 品詞の働き（名詞・動詞・形容詞・副詞）の基本把握", "02. 5文型（SV, SVO, SVC, SVOO, SVOC）の完全識別", "03. 主語と動詞の一致・基本時制（現在・過去・未来）", "04. 進行形と完了形（継続・経験・完了）のコアイメージ", "05. 受動態の基本と「by以外」が使われる重要表現", 
          "06. 不定詞（名詞・形容詞・副詞的用法）の識別", "07. 動名詞の基本用法と不定詞との使い分けルール", "08. 分詞（現在分詞・過去分詞）の形容詞的用法", "09. 基本の助動詞（can, must, should等）と過去＋have p.p.", "10. 関係代名詞（who, which, that）の基本と制限・継続",
          "11. 関係副詞（where, when, why, how）と複合関係詞", "12. 比較の基本（原級・比較級・最上級）と倍数表現", "13. 仮定法過去と仮定法過去完了の構造と訳し方", "14. ifを省略した倒置構文および I wish / as if 構文", "15. 接続詞（and, but, because等）の論理関係の把握", 
          "16. 前置詞のイメージ把握と重要前置詞句のマスター", "17. 否定表現（部分否定、全否定、倒置による強調）", "18. 強調・省略・挿入・同格の構文把握", "19. 語源（接頭辞・語根・接尾辞）を活用した語彙力強化", "20. パラグラフ・リーディングの基礎（トピック文の発見）",
          "21. 指示語（this, it, such等）が指す内容の正確な特定", "22. 空欄補充問題における論理的アプローチと文脈把握", "23. 内容一致・真偽判定問題における選択肢の吟味法", "24. 抽象度の高い論説文におけるキーワードの追跡", "25. 物語・小説文における登場人物の心情・状況変化の把握", 
          "26. グラフ・データ・表付き英文の効率的な読み取り", "27. メッセージ・広告・実用英語の速読と情報抽出", "28. スラッシュリーディングによる返り読みの防止訓練", "29. 構造が複雑な複文・多重埋め込み文の精読", "30. 国公立大の記述式和訳・内容説明問題のポイント",
          "31. 自由英作文につながる質の高い英文インプット", "32. 現代思想・哲学系の難解な抽象長文の攻略", "33. 科学・技術系（サイエンス）論文スタイルの読解", "34. 歴史・文化・社会問題系エッセイの読解演習", "35. ディベート・賛否両論型テーマの対立構造の分析", 
          "36. ディスコースマーカーを活用した論理展開の追跡", "37. 段落の順序整序・空欄挿入問題の解法テクニック", "38. 見出し選択・要約選択問題における筆者の主張把握", "39. 共通テスト形式：情報処理スピードを上げる時間配分", "40. 中堅私大レベルの長文読解における多義語・文脈判断",
          "41. 難関私大レベルの癖のある長文と古風な表現の読解", "42. 旧帝大レベルの長文要約・論述トレーニング", "43. 制限時間を厳しく設定したスピード模試演習", "44. 過去問演習：正答率を上げる見直し・失点分析テクニック", "45. ケアレスミスを防ぐ精読と速読のバランス調整", 
          "46. 長文全体のトーンと筆者の最終的主張のすばやい把握", "47. 頻出テーマ（グローバル化・環境・AI等）の背景知識", "48. 過去問の徹底周回による得点最大化戦略の確立", "49. 弱点補強：苦手な文法項目・長文ジャンルの集中リトライ", "50. 英語リーディング総仕上げ・ファイナル総合テスト"
        ]
      }
    ];

    // ロードマップの描画処理
    function renderRoadmap() {
      const container = document.getElementById('roadmap-container');
      if (!container) return;
      container.innerHTML = subjects.map(s => `
        <div class="roadmap-card">
          <div class="roadmap-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
            <span style="font-weight:bold; color:${s.color};">${s.name}</span>
            <span style="font-size:0.85rem; color:var(--muted);">50ステップ ▼</span>
          </div>
          <div class="roadmap-body">
            <ol>
              ${s.steps.map(step => `<li>${step}</li>`).join('')}
            </ol>
          </div>
        </div>
      `).join('');
    }
    window.addEventListener('DOMContentLoaded', renderRoadmap);
  </script>
</body>
</html>
