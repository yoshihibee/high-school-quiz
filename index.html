<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>高校全15科目 学習・演習総合ポータル</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --accent: #3b82f6; }
    body { font-family: sans-serif; max-width: 950px; margin: 0 auto; padding: 20px; line-height: 1.6; background: var(--bg); color: var(--text); }
    header { text-align: center; margin-bottom: 20px; }
    header p { color: var(--muted); }
    .tab-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: #334155; color: var(--muted); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .card { border: 1px solid var(--border); padding: 20px; border-radius: 8px; background: var(--card); margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
    .scard { border: 1px solid var(--border); padding: 15px; border-radius: 6px; background: #111827; position: relative; overflow: hidden; cursor: pointer; transition: 0.2s; }
    .scard:hover { border-color: var(--c); transform: translateY(-2px); }
    .scard::before { content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--c); }
    .scard h4 { margin: 0 0 10px 0; }
    .roadmap-card { border: 1px solid var(--border); border-radius: 6px; background: #111827; margin-bottom: 12px; overflow: hidden; }
    .roadmap-header { padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .roadmap-header:hover { background: rgba(255,255,255,0.02); }
    .roadmap-body { display: none; padding: 15px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); max-height: 400px; overflow-y: auto; }
    .roadmap-body ol { margin: 0; padding-left: 20px; }
    .roadmap-body li { margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 8px; font-weight: bold; }
    .btn:hover { opacity: 0.9; }
    select, input { padding: 8px; width: 100%; margin-bottom: 8px; background: var(--bg); color: #fff; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 3px; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; }
    .badge-diff { background: #d97706; }
    .badge-correct { background: #059669; float: right; }
    .badge-wrong { background: #dc2626; float: right; }
    .badge-unsolved { background: #475569; float: right; }
    .opts-list { margin: 10px 0; padding-left: 20px; }
    .ans-box { background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; padding: 8px; margin-top: 8px; color: #34d399; font-size: 0.9rem; }
    .exp-box { background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; padding: 8px; margin-top: 6px; color: #93c5fd; font-size: 0.9rem; }
    #quiz-play-area { display: none; }
    .opt-btn { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; border: 1px solid var(--border); background: #111827; color: #fff; border-radius: 4px; cursor: pointer; }
    .opt-btn:hover { background: #334155; }
  </style>
</head>
<body>

  <header>
    <h1>高校全15科目 学習・演習総合ポータル</h1>
    <p>ダークモード ｜ 50段階詳細ロードマップ ｜ 個別正誤管理</p>
  </header>

  <div class="tab-menu">
    <button class="tab-btn active" onclick="switchTab('quiz')">🎯 クイズを解く</button>
    <button class="tab-btn" onclick="switchTab('roadmap')">📖 50段階ロードマップ</button>
    <button class="tab-btn" onclick="switchTab('history')">📊 成績・問題一覧</button>
  </div>

  <!-- ① クイズ画面 -->
  <div id="view-quiz" class="view-section active">
    <div class="card" id="quiz-select-card">
      <h3>🎯 科目・難易度を選択してクイズ挑戦</h3>
      <div class="grid" id="quiz-subject-list"></div>
    </div>
    <div class="card" id="quiz-play-area">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <button class="btn" style="width:auto; padding:5px 15px; background:#475569;" onclick="exitQuiz()">← 戻る</button>
        <div><span id="quiz-progress" style="margin-right:15px; color:var(--muted);"></span><span id="quiz-score" style="color:#34d399; font-weight:bold;"></span></div>
      </div>
      <h2 id="quiz-q-text" style="font-size:1.2rem; margin-bottom:20px;"></h2>
      <div id="quiz-options"></div>
      <div id="quiz-feedback" style="margin-top:15px; display:none;">
        <h4 id="quiz-judge" style="font-size:1.1rem; margin-bottom:5px;"></h4>
        <div id="quiz-exp" class="exp-box"></div>
        <button class="btn" style="margin-top:15px;" onclick="nextQuizQuestion()">次の問題へ →</button>
      </div>
    </div>
  </div>

  <!-- ② ロードマップ画面 -->
  <div id="view-roadmap" class="view-section">
    <div class="card">
      <h3>📖 高校全15科目 50段階学習ステップロードマップ</h3>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:15px;">科目をクリックすると、1〜50までの詳細ステップが展開されます。</p>
      <div id="roadmap-container"></div>
    </div>
  </div>

  <!-- ③ 成績一覧画面 -->
  <div id="view-history" class="view-section">
    <div id="history-main-view">
      <div class="card"><h3>📊 総合学習サマリー</h3><div id="overall-summary-box"></div></div>
      <div class="card"><h3>📚 科目別 成績一覧</h3><div class="grid" id="history-subject-grid"></div></div>
    </div>
    <div id="history-detail-view" class="card" style="display: none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <button class="btn" style="width:auto; padding:5px 15px; background:#475569;" onclick="backToHistoryMain()">← 戻る</button>
        <h3 id="detail-subject-title" style="margin:0; color:var(--accent);"></h3>
      </div>
      <label>🔍 難易度フィルター:</label>
      <select id="detail-diff-filter" onchange="renderSubjectDetailQuestions()"><option value="all">すべての難易度</option></select>
      <div id="detail-questions-container"></div>
    </div>
  </div>

  <script>
    const subjects = [
      { code: "eng_read", name: "英語リーディング", color: "#3b82f6", theme: "文法構造と長文読解" },
      { code: "eng_listen", name: "英語リスニング", color: "#60a5fa", theme: "音声知覚と実践的リスニング" },
      { code: "math1", name: "数学I", color: "#10b981", theme: "数と式・二次関数・図形と計量" },
      { code: "math_a", name: "数学A", color: "#34d399", theme: "場合の数・確率・図形の性質・整数" },
      { code: "math2", name: "数学Ⅱ", color: "#059669", theme: "式と証明・三角関数・微積分基礎" },
      { code: "math_b", name: "数学B", color: "#047857", theme: "数列・漸化式・統計的な推測" },
      { code: "math_c", name: "数学C", color: "#6ee7b7", theme: "ベクトル・二次曲線・複素数平面" },
      { code: "kokugo_gen", name: "現代文", color: "#f59e0b", theme: "論説文・小説の構造的読解力" },
      { code: "kokugo_ko", name: "古文", color: "#fbbf24", theme: "古典文法・古文単語・作品読解" },
      { code: "kokugo_kan", name: "漢文", color: "#d97706", theme: "句形・書き下し文・中国思想" },
      { code: "chem_base", name: "化学基礎", color: "#8b5cf6", theme: "物質の構成・モル計算・中和反応" },
      { code: "earth_base", name: "地学基礎", color: "#a78bfa", theme: "地球内部・気象・宇宙の進化" },
      { code: "geo_tankyu", name: "地理総合探究", color: "#ec4899", theme: "GIS・自然環境・産業とグローバル化" },
      { code: "seikei", name: "公共政治経済", color: "#f43f5e", theme: "民主主義・憲法・市場経済・国際社会" },
      { code: "info1", name: "情報I", color: "#06b6d4", theme: "情報モラル・セキュリティ・プログラミング" }
    ];

    // 50ステップを自動生成する軽量ヘルパー関数
    subjects.forEach(sub => {
      sub.steps = Array.from({length: 50}, (_, i) => `${sub.name}の重要テーマ ${i+1}段階目（基礎から応用・発展までの段階的習得プロセス）`);
    });

    let currentDetailCode = "", cachedQuestions = [], activeCode = "", qData = [], qIdx = 0, score = 0;

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      const idx = name === 'quiz' ? 0 : name === 'roadmap' ? 1 : 2;
      document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      document.getElementById(`view-${name}`).classList.add('active');
      if (name === 'history') loadHistory();
    }

    function init() {
      const qList = document.getElementById('quiz-subject-list');
      const rmContainer = document.getElementById('roadmap-container');
      qList.innerHTML = ''; rmContainer.innerHTML = '';

      let diffOpts = '<option value="all">すべての難易度</option>';
      for(let i=1; i<=20; i++) diffOpts += `<option value="${i}">レベル ${i}</option>`;

      subjects.forEach((sub, idx) => {
        // クイズカード
        const card = document.createElement('div');
        card.className = 'scard'; card.style.setProperty('--c', sub.color);
        card.innerHTML = `<h4 style="color:${sub.color}">${sub.name}</h4><label>難易度:</label><select id="diff-${sub.code}" onclick="event.stopPropagation()">${diffOpts}</select><button class="btn" style="background:${sub.color}" onclick="event.stopPropagation();startQuiz('${sub.code}')">🎯 クイズ開始</button>`;
        qList.appendChild(card);

        // ロードマップカード
        const rm = document.createElement('div');
        rm.className = 'roadmap-card'; rm.style.borderLeft = `4px solid ${sub.color}`;
        rm.innerHTML = `<div class="roadmap-header" onclick="toggleRm(${idx})"><h4 style="color:${sub.color}">${sub.name} <span style="font-size:0.8rem;color:var(--muted)">(全50ステップ)</span></h4><span id="icon-${idx}">▼ 開く</span></div><div class="roadmap-body" id="body-${idx}"><ol>${sub.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>`;
        rmContainer.appendChild(rm);
      });

      let df = '<option value="all">すべての難易度</option>';
      for(let i=1; i<=20; i++) df += `<option value="${i}">レベル ${i}</option>`;
      document.getElementById('detail-diff-filter').innerHTML = df;
    }

    function toggleRm(i) {
      const b = document.getElementById(`body-${i}`), ic = document.getElementById(`icon-${i}`);
      b.style.display = b.style.display === 'block' ? 'none' : 'block';
      ic.innerText = b.style.display === 'block' ? '▲ 閉じる' : '▼ 開く';
    }

    async function startQuiz(code) {
      activeCode = code;
      const diff = document.getElementById(`diff-${code}`).value;
      try {
        const res = await fetch(`db_${code}.json`);
        if (!res.ok) { alert("問題データがまだありません。"); return; }
        const all = await res.json();
        qData = diff === 'all' ? [...all] : all.filter(q => String(q.difficulty) === diff);
        if (!qData.length) { alert("該当難易度の問題がありません。"); return; }
        qIdx = 0; score = 0;
        document.getElementById('quiz-select-card').style.display = 'none';
        document.getElementById('quiz-play-area').style.display = 'block';
        showQ();
      } catch { alert("データ読み込みエラー"); }
    }

    function showQ() {
      document.getElementById('quiz-feedback').style.display = 'none';
      const q = qData[qIdx];
      document.getElementById('quiz-progress').innerText = `問題 ${qIdx+1} / ${qData.length}`;
      document.getElementById('quiz-score').innerText = `正解数: ${score}`;
      document.getElementById('quiz-q-text').innerText = `[レベル ${q.difficulty||1}] ${q.q}`;
      const optDiv = document.getElementById('quiz-options'); optDiv.innerHTML = '';
      q.opts.forEach((o, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn'; btn.innerText = `${i+1}. ${o}`;
        btn.onclick = () => answerQ(i);
        optDiv.appendChild(btn);
      });
    }

    function answerQ(idx) {
      const q = qData[qIdx], correct = idx === q.a;
      saveRes(activeCode, q.id || qIdx, correct);
      if (correct) score++;
      const j = document.getElementById('quiz-judge');
      j.innerHTML = correct ? "⭕ 正解！" : `❌ 不正解... (正解: ${q.a+1}. ${q.opts[q.a]})`;
      j.style.color = correct ? "#34d399" : "#f87171";
      document.getElementById('quiz-exp').innerHTML = `<strong>📖 解説:</strong> ${q.exp || '解説なし'}`;
      document.getElementById('quiz-feedback').style.display = 'block';
      document.querySelectorAll('#quiz-options .opt-btn').forEach(b => b.disabled = true);
    }

    function nextQuizQuestion() {
      qIdx++;
      if (qIdx < qData.length) showQ();
      else { alert(`終了！ スコア: ${score} / ${qData.length}`); exitQuiz(); }
    }

    function exitQuiz() {
      document.getElementById('quiz-play-area').style.display = 'none';
      document.getElementById('quiz-select-card').style.display = 'block';
    }

    function saveRes(code, id, ok) {
      let h = JSON.parse(localStorage.getItem('quiz_results') || '{}');
      if (!h[code]) h[code] = {};
      h[code][id] = ok;
      localStorage.setItem('quiz_results', JSON.stringify(h));
    }

    async function loadHistory() {
      document.getElementById('history-main-view').style.display = 'block';
      document.getElementById('history-detail-view').style.display = 'none';
      let h = JSON.parse(localStorage.getItem('quiz_results') || '{}'), totS = 0, totC = 0;
      const grid = document.getElementById('history-subject-grid'); grid.innerHTML = '';
      subjects.forEach(sub => {
        let subRes = h[sub.code] || {}, sCount = Object.keys(subRes).length, cCount = Object.values(subRes).filter(v => v).length;
        totS += sCount; totC += cCount;
        let rate = sCount ? Math.round((cCount/sCount)*100) : 0;
        const card = document.createElement('div');
        card.className = 'scard'; card.style.setProperty('--c', sub.color);
        card.onclick = () => openDetail(sub.code, sub.name);
        card.innerHTML = `<h4 style="color:${sub.color}">${sub.name}</h4><p style="margin:4px 0;font-size:0.85rem;color:var(--muted)">解答済: <strong>${sCount}</strong>問 | 正解: <strong style="color:#34d399">${cCount}</strong>問 (${rate}%)</p>`;
        grid.appendChild(card);
      });
      let tRate = totS ? Math.round((totC/totS)*100) : 0;
      document.getElementById('overall-summary-box').innerHTML = `<p>総解答数: <strong>${totS}問</strong> ｜ 全体正答率: <strong style="color:var(--accent)">${tRate}%</strong></p>`;
    }

    async function openDetail(code, name) {
      currentDetailCode = code;
      document.getElementById('detail-subject-title').innerText = `${name} - 詳細`;
      document.getElementById('history-main-view').style.display = 'none';
      document.getElementById('history-detail-view').style.display = 'block';
      document.getElementById('detail-diff-filter').value = 'all';
      const c = document.getElementById('detail-questions-container'); c.innerHTML = "読み込み中...";
      try {
        const res = await fetch(`db_${code}.json`);
        if (!res.ok) { c.innerHTML = "データがありません。"; return; }
        cachedQuestions = await res.json();
        renderDetailQ();
      } catch { c.innerHTML = "読み込みエラー"; }
    }

    function renderDetailQ() {
      const f = document.getElementById('detail-diff-filter').value, c = document.getElementById('detail-questions-container');
      let data = f === 'all' ? cachedQuestions : cachedQuestions.filter(q => String(q.difficulty) === f);
      if (!data.length) { c.innerHTML = "該当する問題はありません。"; return; }
      let h = JSON.parse(localStorage.getItem('quiz_results') || '{}')[currentDetailCode] || {};
      let html = `<p style="color:var(--muted);margin-bottom:15px">表示中: <strong>${data.length}問</strong></p>`;
      data.forEach((q, idx) => {
        let id = q.id || idx, st = h[id];
        let badge = st === true ? '<span class="badge badge-correct">⭕ 過去正解</span>' : st === false ? '<span class="badge badge-wrong">❌ 過去不正解</span>' : '<span class="badge badge-unsolved">未挑戦</span>';
        let opts = q.opts.map((o, i) => `<li style="${i===q.a?'font-weight:bold;color:#34d399':''}">${i+1}. ${o}</li>`).join('');
        html += `<div class="card" style="margin-bottom:15px;background:#111827"><div><span class="badge badge-diff">レベル ${q.difficulty||1}</span> ${badge}</div><p style="margin-top:10px"><strong>Q. ${q.q}</strong></p><ul class="opts-list">${opts}</ul><div class="ans-box"><strong>💡 正解:</strong> ${q.a+1}. ${q.opts[q.a]}</div><div class="exp-box"><strong>📖 解説:</strong> ${q.exp||'なし'}</div></div>`;
      });
      c.innerHTML = html;
    }

    function backToHistoryMain() {
      document.getElementById('history-detail-view').style.display = 'none';
      document.getElementById('history-main-view').style.display = 'block';
    }

    init();
  </script>
</body>
</html>
