name: Auto Quiz Generator

on:
  # 1. 毎日日本時間の朝5:00（UTC 20:00）に自動で実行する設定
  schedule:
    - cron: '0 20 * * *'

  # 2. GitHubの画面から手動でもボタン一つで実行できるようにする設定
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai

      - name: Run quiz generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python make_quiz.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}"
          git add .
          git commit -m "Auto-generate latest quiz data" || exit 0
          git push
